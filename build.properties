# Build properties for the Hello World WAR.
#
# The build directory tree lives under the BACKUP_HOME directory. Ant cannot
# read environment variables from a static properties file, so build.sh writes
# the resolved BACKUP_HOME value into the `base.dir` property below before
# running Ant.
#
# Directory layout produced by the build:
#   ${BACKUP_HOME}/helloworld/src   <- copied source tree
#   ${BACKUP_HOME}/helloworld/build <- compiled classes, WEB-INF/lib, and the WAR
#
# Ant variable expansion turns ${base.dir} into ${BACKUP_HOME}/helloworld.
servlet.api.jar=/usr/local/tomcat/lib/servlet-api.jar
war.name=helloworld.war
webapp.dir=/opt/tomcat/instances/tc1/webapps
base.dir=/opt/backup
build.dir=${base.dir}/helloworld/build
